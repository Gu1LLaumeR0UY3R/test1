services:
  php:
    build: .
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      - db
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
